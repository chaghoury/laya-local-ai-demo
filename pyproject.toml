[project]
name = "laya-local-ai-demo"
version = "0.1.0"
description = "A local-first support-ticket routing demo built on Laya."
requires-python = ">=3.10"
dependencies = ["laya>=0.3.26,<0.4"]

[project.scripts]
laya-local-ai-demo = "laya_local_ai_demo.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[dependency-groups]
dev = ["ipykernel>=7.3.0", "nbclient>=0.11.0", "pytest>=9.1.1", "ruff>=0.16.10"]
